name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu (CPU only, OpenGL on llvmpipe, Vulkan on lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules \
            libgl-dev libegl-dev libegl-mesa0 libgl1-mesa-dri \
            libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ubuntu-24.04
          max-size: 2G

      # CUDA needs a GPU which the hosted runners don't have.
      # The OpenGL tests run headless on an EGL context from Mesa's software renderer (llvmpipe), the Vulkan tests
      # on Mesa's software driver (lavapipe) with the validation layer.
      # SAIGA_WRITE_PROJECT_DIR_TO_HEADER lets the tests find shader/ and data/ from the build dir.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSAIGA_MODULE_CUDA=OFF \
            -DSAIGA_MODULE_OPENGL=ON \
            -DSAIGA_MODULE_VULKAN=ON \
            -DSAIGA_BUILD_SAMPLES=OFF \
            -DSAIGA_ARCHNATIVE=OFF \
            -DSAIGA_WRITE_PROJECT_DIR_TO_HEADER=ON

      # A missing dependency silently disables a module, so check that Vulkan is really built.
      - name: Check enabled modules
        run: grep -q "define SAIGA_USE_VULKAN" build/include/saiga/saiga_modules.h

      - name: Build
        run: cmake --build build --parallel -- -k 0

      # The Vulkan tests skip themselves without a Vulkan 1.3 driver, so check that lavapipe is really used.
      - name: Check Vulkan driver
        run: |
          ./build/tests/test_vulkan_device | tee vulkan_device.log
          ! grep -q SKIPPED vulkan_device.log

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel 4

      # The metrics of the golden comparisons (also of passing runs), to see how far CI's Mesa is from the goldens.
      # Read from ctest's log (ctest hides the output of passing tests), so nothing is rendered twice.
      - name: Golden image metrics
        if: success() || failure()
        run: grep -E '^golden|trees per lod' build/Testing/Temporary/LastTest.log || true

      # Golden image tests (tests/golden_image.h) write the actual and difference images of a failed comparison to
      # golden_failed/ in the test working directory.
      - name: Upload failed golden images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One artifact per job (artifact names must be unique within a run)
          name: golden-failed-${{ github.job }}
          path: build/tests/golden_failed/
          if-no-files-found: ignore
