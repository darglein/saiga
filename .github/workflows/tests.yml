name: Tests

# Changes of only documentation (docs/, Markdown) build nothing.
on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu (CPU only, OpenGL on llvmpipe, Vulkan on lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules \
            libgl-dev libegl-dev libegl-mesa0 libgl1-mesa-dri \
            libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers locales
          # A locale with a decimal comma for Ini.IndependentOfCLocale (it skips without one; nothing may skip here)
          sudo locale-gen de_DE.UTF-8

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ubuntu-24.04-gcc
          max-size: 2G

      # CUDA needs a GPU which the hosted runners don't have.
      # The OpenGL tests run headless on an EGL context from Mesa's software renderer (llvmpipe), the Vulkan tests
      # on Mesa's software driver (lavapipe) with the validation layer.
      # SAIGA_WRITE_PROJECT_DIR_TO_HEADER lets the tests find shader/ and data/ from the build dir.
      # SAIGA_WARNINGS_AS_ERRORS: a compiler or linker warning in the saiga code (not the submodules) fails the build, in
      # all three jobs.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSAIGA_MODULE_CUDA=OFF \
            -DSAIGA_MODULE_OPENGL=ON \
            -DSAIGA_MODULE_VULKAN=ON \
            -DSAIGA_BUILD_SAMPLES=OFF \
            -DSAIGA_ARCHNATIVE=OFF \
            -DSAIGA_WRITE_PROJECT_DIR_TO_HEADER=ON \
            -DSAIGA_WARNINGS_AS_ERRORS=ON

      # A missing dependency silently disables a module, so check that Vulkan is really built.
      - name: Check enabled modules
        run: |
          grep -q "define SAIGA_USE_VULKAN" build/include/saiga/saiga_modules.h
          grep -q "define SAIGA_USE_ENGINE" build/include/saiga/saiga_modules.h

      - name: Build
        run: cmake --build build --parallel -- -k 0

      # The Vulkan tests skip themselves without a Vulkan 1.3 driver, so check that lavapipe is really used.
      - name: Check Vulkan driver
        shell: bash
        run: |
          ./build/tests/test_vulkan_device | tee vulkan_device.log
          ! grep -q SKIPPED vulkan_device.log

      # On this runner no test may skip (Vulkan on lavapipe, OpenGL on llvmpipe): a skip means a lost driver. Every test
      # binary writes a gtest XML report; any test case with result="skipped" fails the job (also single skipped cases
      # in an otherwise passing binary, which ctest reports as passed).
      - name: Test
        working-directory: build
        shell: bash
        env:
          GTEST_OUTPUT: xml:${{ github.workspace }}/build/gtest_xml/
        run: |
          ctest --output-on-failure --parallel 4
          # grep: 0 = skipped cases found, 1 = none, 2 = a report could not be read (fails too)
          compgen -G 'gtest_xml/*.xml' > /dev/null || { echo "no gtest reports"; exit 1; }
          rc=0; grep -l 'result="skipped"' gtest_xml/*.xml || rc=$?
          if [ "$rc" -eq 0 ]; then echo "skipped tests (see the files above)"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "could not scan the gtest reports"; exit 1; fi

      # The metrics of the golden comparisons (also of passing runs), to see how far CI's Mesa is from the goldens, and
      # the timings of the non-gating ECS benchmark. Read from ctest's log (ctest hides the output of passing tests), so
      # nothing runs twice.
      - name: Golden image metrics
        if: success() || failure()
        run: grep -E '^golden|trees per lod|^ECS benchmark' build/Testing/Temporary/LastTest.log || true

      # Golden image tests (tests/golden_image.h) write the actual and difference images of a failed comparison to
      # golden_failed/ in the test working directory.
      - name: Upload failed golden images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One artifact per job (artifact names must be unique within a run)
          name: golden-failed-${{ github.job }}
          path: build/tests/golden_failed/
          if-no-files-found: ignore

  # The same CPU-only setup built with Clang (docs/engine_design.md S04: every engine stage builds with GCC, Clang and
  # MSVC). This job also builds the samples, so the tech demo games (samples/games/, game_flight/platformer/racing,
  # docs/engine_design.md §18.4) are compiled in CI; they are not run (they need a window).
  ubuntu-clang:
    name: Ubuntu Clang (CPU only, OpenGL on llvmpipe, Vulkan on lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libomp-dev cmake ninja-build ccache \
            xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules \
            libgl-dev libegl-dev libegl-mesa0 libgl1-mesa-dri \
            libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers locales
          # A locale with a decimal comma for Ini.IndependentOfCLocale (it skips without one; nothing may skip here)
          sudo locale-gen de_DE.UTF-8

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ubuntu-24.04-clang
          max-size: 2G

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSAIGA_MODULE_CUDA=OFF \
            -DSAIGA_MODULE_OPENGL=ON \
            -DSAIGA_MODULE_VULKAN=ON \
            -DSAIGA_BUILD_SAMPLES=ON \
            -DSAIGA_ARCHNATIVE=OFF \
            -DSAIGA_WRITE_PROJECT_DIR_TO_HEADER=ON \
            -DSAIGA_WARNINGS_AS_ERRORS=ON \
            -DSAIGA_CONTENT_UBSAN=ON

      - name: Check enabled modules
        run: |
          grep -q "define SAIGA_USE_VULKAN" build/include/saiga/saiga_modules.h
          grep -q "define SAIGA_USE_ENGINE" build/include/saiga/saiga_modules.h
          # The headless OpenGL tests need EGL (without it they are not registered at all)
          grep -q "define SAIGA_USE_OPENGL" build/include/saiga/saiga_modules.h
          grep -q "define SAIGA_USE_EGL" build/include/saiga/saiga_modules.h

      - name: Build
        run: cmake --build build --parallel -- -k 0

      # The Vulkan tests skip themselves without a Vulkan 1.3 driver, so check that lavapipe is really used.
      - name: Check Vulkan driver
        shell: bash
        run: |
          ./build/tests/test_vulkan_device | tee vulkan_device.log
          ! grep -q SKIPPED vulkan_device.log

      # No test may skip on this runner (see the GCC job)
      - name: Test
        working-directory: build
        shell: bash
        env:
          GTEST_OUTPUT: xml:${{ github.workspace }}/build/gtest_xml/
        run: |
          ctest --output-on-failure --parallel 4
          # grep: 0 = skipped cases found, 1 = none, 2 = a report could not be read (fails too)
          compgen -G 'gtest_xml/*.xml' > /dev/null || { echo "no gtest reports"; exit 1; }
          rc=0; grep -l 'result="skipped"' gtest_xml/*.xml || rc=$?
          if [ "$rc" -eq 0 ]; then echo "skipped tests (see the files above)"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "could not scan the gtest reports"; exit 1; fi

      # The metrics of the golden comparisons (also of passing runs), to see how far CI's Mesa is from the goldens, and
      # the timings of the non-gating ECS benchmark. Read from ctest's log (ctest hides the output of passing tests), so
      # nothing runs twice.
      - name: Golden image metrics
        if: success() || failure()
        run: grep -E '^golden|trees per lod|^ECS benchmark' build/Testing/Temporary/LastTest.log || true

      # Golden image tests (tests/golden_image.h) write the actual and difference images of a failed comparison to
      # golden_failed/ in the test working directory.
      - name: Upload failed golden images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One artifact per job (artifact names must be unique within a run)
          name: golden-failed-${{ github.job }}
          path: build/tests/golden_failed/
          if-no-files-found: ignore

  # Windows with MSVC and shared libraries (the DLL export macros matter). Core, Vulkan and the engine with their tests;
  # without a Vulkan driver the Vulkan tests skip themselves.
  # Built with Ninja and ccache (like the Ubuntu jobs): ccache caches MSVC only with the debug information embedded in
  # the objects (/Z7, CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded; /Zi writes a shared PDB), and only without /MP
  # (cmake/Saiga_compiler_flags.cmake adds it for the Visual Studio generators only).
  windows-msvc:
    name: Windows MSVC (shared libraries)
    runs-on: windows-2025
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          vulkan_version: 1.4.363.1
          install_runtime: true
          cache: true
          stripdown: true

      # The MSVC environment (cl, link, the SDK paths) for Ninja
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: windows-2025-msvc
          max-size: 2G

      # One output directory, so the tests find the saiga DLLs next to them.
      # CMP0141 (CMake 3.25) enables CMAKE_MSVC_DEBUG_INFORMATION_FORMAT; the project's minimum version leaves it unset.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          -DSAIGA_BUILD_SHARED=ON
          -DSAIGA_MODULE_CUDA=OFF
          -DSAIGA_MODULE_OPENGL=OFF
          -DSAIGA_MODULE_VISION=OFF
          -DSAIGA_MODULE_VULKAN=ON
          -DSAIGA_BUILD_SAMPLES=OFF
          -DSAIGA_ARCHNATIVE=OFF
          -DSAIGA_WRITE_PROJECT_DIR_TO_HEADER=ON
          -DSAIGA_WARNINGS_AS_ERRORS=ON
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/build/bin"

      - name: Check enabled modules
        shell: bash
        run: |
          grep -q "define SAIGA_USE_VULKAN" build/include/saiga/saiga_modules.h
          grep -q "define SAIGA_USE_ENGINE" build/include/saiga/saiga_modules.h

      - name: Build
        run: cmake --build build --parallel -- -k 0

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel 4
